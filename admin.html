<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Base Clash of Clans</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #121923;
      --card-2: #17212d;
      --border: #263445;
      --text: #f3f6fa;
      --muted: #91a0b3;
      --primary: #4f8cff;
      --primary-hover: #3978eb;
      --danger: #ef5350;
      --danger-hover: #d83c39;
      --success: #35c779;
      --input: #0e151e;
      --shadow: 0 12px 35px rgba(0,0,0,.28);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(79,140,255,.10), transparent 32%),
        radial-gradient(circle at bottom left, rgba(53,199,121,.06), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .container {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 45px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 27px);
      line-height: 1.15;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: rgba(18,25,35,.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .login-panel {
      max-width: 460px;
      margin: 55px auto 0;
      padding: 25px;
    }

    .login-panel h2 {
      margin: 0 0 7px;
      font-size: 24px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.5;
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #d9e1ea;
    }

    input,
    select,
    textarea {
      width: 100%;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      padding: 12px 13px;
      transition: border-color .18s, box-shadow .18s;
    }

    input,
    select {
      min-height: 46px;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,140,255,.13);
    }

    input[type="file"] {
      padding: 9px;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--card-2);
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      min-height: 44px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 750;
      transition: transform .12s, background .18s, opacity .18s;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      color: #fff;
      background: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--card-2);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #1d2a39;
    }

    .full {
      width: 100%;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
      border: 1px solid transparent;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffc8c7;
      background: rgba(239,83,80,.10);
      border-color: rgba(239,83,80,.28);
    }

    .message.success {
      color: #bff2d5;
      background: rgba(53,199,121,.10);
      border-color: rgba(53,199,121,.25);
    }

    .message.info {
      color: #c9ddff;
      background: rgba(79,140,255,.10);
      border-color: rgba(79,140,255,.25);
    }

    .hidden {
      display: none !important;
    }

    #admin-panel {
      display: none;
    }

    .admin-head {
      padding: 17px 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .admin-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .admin-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .content {
      padding: 19px;
    }

    .upload-form {
      display: grid;
      gap: 16px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .preview {
      display: none;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--input);
    }

    .preview.show {
      display: block;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 27px 0 13px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 18px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .base-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .base-card {
      overflow: hidden;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .base-image-wrap {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #0a0f15;
    }

    .base-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .th-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      background: rgba(7,11,16,.84);
      border: 1px solid rgba(255,255,255,.14);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .base-body {
      padding: 13px;
    }

    .base-title {
      margin: 0 0 7px;
      font-size: 16px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .tag {
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 11px;
      color: #d9e7ff;
      background: rgba(79,140,255,.11);
      border: 1px solid rgba(79,140,255,.20);
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }

    .base-actions {
      display: flex;
      gap: 8px;
    }

    .base-actions .btn {
      flex: 1;
      min-height: 40px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .empty {
      padding: 28px 15px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .loading {
      opacity: .65;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: -3px;
      margin-right: 7px;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 18px, 1100px);
        padding-top: 12px;
      }

      .login-panel {
        margin-top: 28px;
        padding: 19px;
      }

      .admin-head {
        align-items: flex-start;
      }

      .admin-head .btn {
        flex-shrink: 0;
      }

      .content {
        padding: 14px;
      }

      .two-col,
      .base-list {
        grid-template-columns: 1fr;
      }

      .brand p {
        display: none;
      }

      .topbar {
        margin-bottom: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Base Clash of Clans" onerror="this.style.display='none'">
        <div class="brand-text">
          <h1>Base Clash of Clans</h1>
          <p>Admin Panel</p>
        </div>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="login-panel" class="panel login-panel">
      <h2>Admin Login</h2>
      <p class="subtitle">Masuk menggunakan akun admin Supabase Authentication.</p>

      <form id="login-form" class="form-grid">
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="admin@email.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          >
        </div>

        <button id="login-button" class="btn btn-primary full" type="submit">
          Login
        </button>
      </form>

      <div id="login-message" class="message" role="alert"></div>
    </section>

    <!-- NOT ADMIN -->
    <section id="not-admin-panel" class="panel login-panel hidden">
      <h2>Akun ini bukan admin</h2>
      <p class="subtitle">
        Akun berhasil login, tetapi tidak terdaftar sebagai admin berdasarkan
        pemeriksaan <code>public.is_admin()</code>.
      </p>
      <button id="not-admin-logout" class="btn btn-secondary full" type="button">
        Logout
      </button>
      <div id="not-admin-message" class="message" role="alert"></div>
    </section>

    <!-- ADMIN PANEL -->
    <section id="admin-panel" class="panel">
      <div class="admin-head">
        <div>
          <h2>Admin Panel</h2>
          <p id="admin-email"></p>
        </div>
        <button id="logout-button" class="btn btn-secondary" type="button">
          Logout
        </button>
      </div>

      <div class="content">
        <form id="base-form" class="upload-form">
          <div class="two-col">
            <div class="field">
              <label for="th">Town Hall</label>
              <select id="th" required>
                <option value="">Pilih TH</option>
                <option value="3">TH3</option>
                <option value="4">TH4</option>
                <option value="5">TH5</option>
                <option value="6">TH6</option>
                <option value="7">TH7</option>
                <option value="8">TH8</option>
                <option value="9">TH9</option>
                <option value="10">TH10</option>
                <option value="11">TH11</option>
                <option value="12">TH12</option>
                <option value="13">TH13</option>
                <option value="14">TH14</option>
                <option value="15">TH15</option>
                <option value="16">TH16</option>
                <option value="17">TH17</option>
                <option value="18">TH18</option>
              </select>
            </div>

            <div class="field">
              <label for="category">Kategori</label>
              <select id="category" required>
                <option value="">Pilih kategori</option>
                <option value="War">War</option>
                <option value="Farming">Farming</option>
                <option value="Trophy">Trophy</option>
                <option value="Hybrid">Hybrid</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="title">Judul Base</label>
            <input
              id="title"
              type="text"
              maxlength="200"
              placeholder="Contoh: TH16 War Base Anti 3 Star"
              required
            >
          </div>

          <div class="field">
            <label for="description">Deskripsi</label>
            <textarea
              id="description"
              maxlength="2000"
              placeholder="Jelaskan keunggulan atau kegunaan base..."
            ></textarea>
          </div>

          <div class="field">
            <label for="coc-link">Link Base Clash of Clans</label>
            <input
              id="coc-link"
              type="url"
              maxlength="2000"
              placeholder="https://link.clashofclans.com/..."
              required
            >
          </div>

          <div class="field">
            <label for="image">Gambar Base</label>
            <input
              id="image"
              type="file"
              accept="image/*"
              required
            >
            <div id="image-preview" class="preview">
              <img id="preview-image" alt="Preview gambar base">
            </div>
          </div>

          <button id="upload-button" class="btn btn-primary full" type="submit">
            Upload Base
          </button>
        </form>

        <div id="form-message" class="message" role="alert"></div>

        <div class="section-title">
          <h3>Base yang Sudah Diupload</h3>
          <span id="base-count" class="count">0 base</span>
        </div>

        <div id="base-list" class="base-list">
          <div class="empty">Memuat data base...</div>
        </div>

        <div id="list-message" class="message" role="alert"></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      /*
       * config.js harus membuat:
       * window.supabaseClient
       *
       * Admin verification WAJIB melalui:
       * supabaseClient.rpc('is_admin')
       *
       * Tidak ada pengecekan langsung ke tabel admin_users dari frontend.
       */

      const supabaseClient = window.supabaseClient;

      const loginPanel = document.getElementById("login-panel");
      const loginForm = document.getElementById("login-form");
      const loginButton = document.getElementById("login-button");
      const loginMessage = document.getElementById("login-message");

      const notAdminPanel = document.getElementById("not-admin-panel");
      const notAdminLogout = document.getElementById("not-admin-logout");
      const notAdminMessage = document.getElementById("not-admin-message");

      const adminPanel = document.getElementById("admin-panel");
      const adminEmail = document.getElementById("admin-email");
      const logoutButton = document.getElementById("logout-button");

      const baseForm = document.getElementById("base-form");
      const uploadButton = document.getElementById("upload-button");
      const formMessage = document.getElementById("form-message");

      const imageInput = document.getElementById("image");
      const imagePreview = document.getElementById("image-preview");
      const previewImage = document.getElementById("preview-image");

      const baseList = document.getElementById("base-list");
      const baseCount = document.getElementById("base-count");
      const listMessage = document.getElementById("list-message");

      let currentSession = null;
      let previewObjectUrl = null;

      function showMessage(element, text, type = "info") {
        element.textContent = text || "";
        element.className = "message" + (text ? " show " + type : "");
      }

      function clearMessage(element) {
        showMessage(element, "");
      }

      function setButtonLoading(button, loading, textWhenLoading, normalText) {
        button.disabled = loading;

        if (loading) {
          button.innerHTML = '<span class="spinner"></span>' + textWhenLoading;
        } else {
          button.textContent = normalText;
        }
      }

      function showLogin() {
        loginPanel.classList.remove("hidden");
        notAdminPanel.classList.add("hidden");
        adminPanel.style.display = "none";
      }

      function showNotAdmin() {
        loginPanel.classList.add("hidden");
        notAdminPanel.classList.remove("hidden");
        adminPanel.style.display = "none";
      }

      function showAdmin(session) {
        loginPanel.classList.add("hidden");
        notAdminPanel.classList.add("hidden");
        adminPanel.style.display = "block";
        adminEmail.textContent = session?.user?.email || "Admin";
      }

      function makeUniqueFileName(file) {
        const originalName = file.name || "image";
        const extensionMatch = originalName.match(/(\.[a-zA-Z0-9]+)$/);
        const extension = extensionMatch ? extensionMatch[1].toLowerCase() : "";
        const randomPart =
          typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now() + "-" + Math.random().toString(36).slice(2);

        return "base-" + Date.now() + "-" + randomPart + extension;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function safeHttpUrl(value) {
        try {
          const url = new URL(value);
          if (url.protocol === "http:" || url.protocol === "https:") {
            return url.href;
          }
        } catch (_) {}
        return "#";
      }

      async function checkAdminAndShowPanel(session) {
        if (!session) {
          currentSession = null;
          showLogin();
          return false;
        }

        currentSession = session;

        /*
         * PENTING:
         * Jangan mengganti pemeriksaan ini dengan query langsung ke admin_users.
         */
        const { data: isAdmin, error } = await supabaseClient.rpc("is_admin");

        if (error) {
          console.error("is_admin RPC error:", error);
          currentSession = null;
          showNotAdmin();
          showMessage(
            notAdminMessage,
            "Gagal memeriksa status admin: " + (error.message || "RPC error"),
            "error"
          );
          return false;
        }

        if (isAdmin === true) {
          showAdmin(session);
          await loadBases();
          return true;
        }

        currentSession = null;
        showNotAdmin();
        showMessage(notAdminMessage, "Akun ini bukan admin", "error");
        return false;
      }

      async function handleLogin(event) {
        event.preventDefault();

        if (!supabaseClient) {
          showMessage(
            loginMessage,
            "window.supabaseClient tidak ditemukan. Periksa config.js.",
            "error"
          );
          return;
        }

        clearMessage(loginMessage);
        setButtonLoading(loginButton, true, "Login...", "Login");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error("Login error:", error);
          setButtonLoading(loginButton, false, "", "Login");
          showMessage(
            loginMessage,
            error.message || "Login gagal.",
            "error"
          );
          return;
        }

        setButtonLoading(loginButton, false, "", "Login");

        const session = data?.session;

        if (!session) {
          showMessage(loginMessage, "Login berhasil tetapi session tidak ditemukan.", "error");
          return;
        }

        const isAdmin = await checkAdminAndShowPanel(session);

        if (!isAdmin) {
          loginForm.reset();
        }
      }

      async function handleLogout() {
        clearMessage(notAdminMessage);
        clearMessage(loginMessage);

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          console.error("Logout error:", error);
          showMessage(notAdminMessage, "Logout gagal: " + error.message, "error");
          return;
        }

        currentSession = null;
        baseForm.reset();
        hidePreview();
        showLogin();
      }

      async function uploadBase(event) {
        event.preventDefault();

        if (!currentSession) {
          showMessage(formMessage, "Session admin tidak ditemukan. Silakan login kembali.", "error");
          return;
        }

        const th = Number(document.getElementById("th").value);
        const title = document.getElementById("title").value.trim();
        const category = document.getElementById("category").value;
        const description = document.getElementById("description").value.trim();
        const cocLink = document.getElementById("coc-link").value.trim();
        const file = imageInput.files[0];

        if (!Number.isInteger(th) || th < 3 || th > 18) {
          showMessage(formMessage, "Pilih Town Hall dari TH3 sampai TH18.", "error");
          return;
        }

        if (!title) {
          showMessage(formMessage, "Judul base wajib diisi.", "error");
          return;
        }

        if (!["War", "Farming", "Trophy", "Hybrid"].includes(category)) {
          showMessage(formMessage, "Kategori tidak valid.", "error");
          return;
        }

        if (!cocLink) {
          showMessage(formMessage, "Link base Clash of Clans wajib diisi.", "error");
          return;
        }

        try {
          const parsedLink = new URL(cocLink);
          if (!["http:", "https:"].includes(parsedLink.protocol)) {
            throw new Error("Protocol");
          }
        } catch (_) {
          showMessage(formMessage, "Link base harus berupa URL http/https yang valid.", "error");
          return;
        }

        if (!file) {
          showMessage(formMessage, "Pilih gambar base terlebih dahulu.", "error");
          return;
        }

        if (!file.type.startsWith("image/")) {
          showMessage(formMessage, "File yang dipilih harus berupa gambar.", "error");
          return;
        }

        clearMessage(formMessage);
        uploadButton.disabled = true;
        uploadButton.innerHTML = '<span class="spinner"></span>Mengupload...';

        let uploadedPath = null;

        try {
          const fileName = makeUniqueFileName(file);
          uploadedPath = fileName;

          // Upload gambar ke bucket public "base-images".
          const { error: uploadError } = await supabaseClient.storage
            .from("base-images")
            .upload(fileName, file, {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            });

          if (uploadError) {
            throw new Error("Upload gambar gagal: " + uploadError.message);
          }

          const { data: publicUrlData } = supabaseClient.storage
            .from("base-images")
            .getPublicUrl(fileName);

          const imageUrl = publicUrlData?.publicUrl;

          if (!imageUrl) {
            throw new Error("Public URL gambar tidak berhasil dibuat.");
          }

          // Simpan data base setelah gambar berhasil diupload.
          const { error: insertError } = await supabaseClient
            .from("base_layouts")
            .insert({
              th,
              title,
              category,
              description,
              image_url: imageUrl,
              coc_link: cocLink,
              views: 0,
              published: true
            });

          if (insertError) {
            // Jika insert gagal, coba hapus file yang baru saja diupload
            // agar tidak meninggalkan file yatim di Storage.
            await supabaseClient.storage
              .from("base-images")
              .remove([uploadedPath]);

            throw new Error("Gagal menyimpan data base: " + insertError.message);
          }

          baseForm.reset();
          hidePreview();

          showMessage(formMessage, "Base berhasil diupload dan dipublikasikan.", "success");
          await loadBases();

          window.scrollTo({
            top: document.getElementById("base-list").getBoundingClientRect().top + window.scrollY - 20,
            behavior: "smooth"
          });
        } catch (error) {
          console.error("Upload base error:", error);
          showMessage(formMessage, error.message || "Upload base gagal.", "error");
        } finally {
          uploadButton.disabled = false;
          uploadButton.textContent = "Upload Base";
        }
      }

      async function loadBases() {
        clearMessage(listMessage);
        baseList.innerHTML = '<div class="empty">Memuat data base...</div>';

        const { data, error } = await supabaseClient
          .from("base_layouts")
          .select("id, th, title, category, description, image_url, coc_link, views, published, created_at")
          .order("created_at", { ascending: false });

        if (error) {
          console.error("Load bases error:", error);
          baseCount.textContent = "Gagal memuat";
          baseList.innerHTML = '<div class="empty">Data base gagal dimuat.</div>';
          showMessage(
            listMessage,
            "Gagal mengambil daftar base: " + error.message,
            "error"
          );
          return;
        }

        const bases = Array.isArray(data) ? data : [];
        baseCount.textContent = bases.length + (bases.length === 1 ? " base" : " base");

        if (bases.length === 0) {
          baseList.innerHTML = '<div class="empty">Belum ada base yang diupload.</div>';
          return;
        }

        baseList.innerHTML = bases.map(renderBaseCard).join("");

        baseList.querySelectorAll("[data-delete-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const id = button.getAttribute("data-delete-id");
            deleteBase(id, button);
          });
        });
      }

      function renderBaseCard(base) {
        const imageUrl = safeHttpUrl(base.image_url);
        const cocLink = safeHttpUrl(base.coc_link);

        return `
          <article class="base-card">
            <div class="base-image-wrap">
              <img
                class="base-image"
                src="${escapeHtml(imageUrl)}"
                alt="${escapeHtml(base.title)}"
                loading="lazy"
                onerror="this.style.display='none'"
              >
              <span class="th-badge">TH${escapeHtml(base.th)}</span>
            </div>

            <div class="base-body">
              <h4 class="base-title">${escapeHtml(base.title)}</h4>

              <div class="meta">
                <span class="tag">${escapeHtml(base.category)}</span>
                <span class="tag">${base.published ? "Published" : "Draft"}</span>
                <span class="tag">${escapeHtml(base.views ?? 0)} views</span>
              </div>

              ${
                base.description
                  ? `<div class="description">${escapeHtml(base.description)}</div>`
                  : ""
              }

              <div class="base-actions">
                ${
                  cocLink !== "#"
                    ? `<a class="btn btn-secondary" href="${escapeHtml(cocLink)}" target="_blank" rel="noopener noreferrer">Buka Link</a>`
                    : ""
                }
                <button
                  type="button"
                  class="btn btn-danger"
                  data-delete-id="${escapeHtml(base.id)}"
                >
                  Hapus
                </button>
              </div>
            </div>
          </article>
        `;
      }

      async function deleteBase(id, button) {
        if (!id) return;

        const confirmed = window.confirm(
          "Hapus base ini dari database? Tindakan ini tidak dapat dibatalkan."
        );

        if (!confirmed) return;

        const oldText = button.textContent;
        button.disabled = true;
        button.innerHTML = '<span class="spinner"></span>Hapus...';

        const { error } = await supabaseClient
          .from("base_layouts")
          .delete()
          .eq("id", id);

        if (error) {
          console.error("Delete base error:", error);
          button.disabled = false;
          button.textContent = oldText;
          showMessage(
            listMessage,
            "Gagal menghapus base: " + error.message,
            "error"
          );
          return;
        }

        showMessage(listMessage, "Base berhasil dihapus dari base_layouts.", "success");
        await loadBases();
      }

      function hidePreview() {
        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = null;
        }

        previewImage.removeAttribute("src");
        imagePreview.classList.remove("show");
      }

      function showPreview(file) {
        if (!file) {
          hidePreview();
          return;
        }

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
        }

        previewObjectUrl = URL.createObjectURL(file);
        previewImage.src = previewObjectUrl;
        imagePreview.classList.add("show");
      }

      async function initialize() {
        if (!supabaseClient) {
          showLogin();
          showMessage(
            loginMessage,
            "window.supabaseClient tidak ditemukan. Pastikan config.js berada di folder yang sama dan membuat window.supabaseClient.",
            "error"
          );
          return;
        }

        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          console.error("getSession error:", error);
          showLogin();
          showMessage(loginMessage, "Gagal mengambil session: " + error.message, "error");
          return;
        }

        if (session) {
          await checkAdminAndShowPanel(session);
        } else {
          showLogin();
        }

        supabaseClient.auth.onAuthStateChange(async (event, sessionFromEvent) => {
          if (event === "SIGNED_OUT") {
            currentSession = null;
            showLogin();
            return;
          }

          if (event === "SIGNED_IN" && sessionFromEvent) {
            await checkAdminAndShowPanel(sessionFromEvent);
          }
        });
      }

      loginForm.addEventListener("submit", handleLogin);
      logoutButton.addEventListener("click", handleLogout);
      notAdminLogout.addEventListener("click", handleLogout);
      baseForm.addEventListener("submit", uploadBase);

      imageInput.addEventListener("change", () => {
        showPreview(imageInput.files[0]);
      });

      initialize();
    })();
  </script>
</body>
</html>
