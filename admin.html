<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Base ClashofClans</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#0b0e13;color:#fff;font:16px system-ui}.wrap{max-width:850px;margin:auto;padding:22px 16px 60px}.panel{background:#151922;border:1px solid #2a3140;border-radius:14px;padding:18px;margin:14px 0}input,select,textarea{width:100%;padding:12px;box-sizing:border-box;background:#0f131b;border:1px solid #343d4d;color:#fff;border-radius:9px}label{font-size:13px;color:#aab3c2;display:block;margin:8px 0 5px}button{padding:11px 15px;border:0;border-radius:9px;background:#48d597;font-weight:800}.danger{background:#d95b5b;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item{border-top:1px solid #2a3140;padding:14px 0}.thumb{width:90px;height:70px;object-fit:cover;border-radius:7px}.muted{color:#9ba5b5}.hide{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><h1>Admin Base ClashofClans</h1><div id="login" class="panel"><h2>Login Admin</h2><input id="email" type="email" placeholder="Email"><label>Password</label><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">Masuk</button><p id="msg"></p></div><div id="app" class="hide"><div class="row"><span id="who" class="muted"></span><button onclick="logout()">Keluar</button></div><div class="panel"><h2>Tambah Base</h2><div class="grid"><div><label>Town Hall</label><select id="th">${Array.from({length:16},(_,i)=>`<option>${i+3}</option>`).join('')}</select></div><div><label>Kategori</label><select id="category"><option value="war">War Base</option><option value="farming">Farming</option><option value="trophy">Trophy</option><option value="hybrid">Hybrid</option></select></div><div class="full"><label>Nama</label><input id="title" placeholder="TH13 Anti 3 Star War"></div><div class="full"><label>Deskripsi</label><textarea id="desc"></textarea></div><div><label>Gambar</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></div><div><label>Link Use This Base</label><input id="link" placeholder="Tempel link layout CoC"></div></div><br><button onclick="add()">Tambah Base</button><p id="addmsg"></p></div><div class="panel"><h2>Daftar Base</h2><div id="list">Memuat...</div></div></div></div><script>
const names={war:'War Base',farming:'Farming',trophy:'Trophy',hybrid:'Hybrid'};async function login(){let r=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:pass.value});msg.textContent=r.error?r.error.message:'Berhasil masuk';if(!r.error)check()}async function check(){let u=(await supabaseClient.auth.getUser()).data.user;if(!u)return;let r=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(r.error||!r.data){await supabaseClient.auth.signOut();msg.textContent='Akun ini bukan admin.';return}loginPanel();who.textContent=u.email;load()}function loginPanel(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide')}async function logout(){await supabaseClient.auth.signOut();location.reload()}async function add(){let f=file.files[0];if(!f){addmsg.textContent='Pilih gambar.';return}addmsg.textContent='Mengunggah...';let path=`th${th.value}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;let u=await supabaseClient.storage.from('base-images').upload(path,f,{contentType:f.type});if(u.error){addmsg.textContent=u.error.message;return}let pub=supabaseClient.storage.from('base-images').getPublicUrl(path).data.publicUrl;r=await supabaseClient.from('base_layouts').insert({th:+th.value,title:title.value.trim(),category:category.value,description:desc.value.trim(),image_url:pub,coc_link:link.value.trim(),published:true});if(r.error){addmsg.textContent=r.error.message;return}addmsg.textContent='Base berhasil ditambahkan.';title.value=desc.value=link.value='';file.value='';load()}async function load(){let r=await supabaseClient.from('base_layouts').select('*').order('created_at',{ascending:false});list.innerHTML=r.error?r.error.message:r.data.length?r.data.map(x=>`<div class="item"><div class="row"><div><b>TH${x.th} — ${x.title}</b><div class="muted">${names[x.category]}</div></div><img class="thumb" src="${x.image_url}"></div><br><button class="danger" onclick="del(${x.id})">Hapus</button></div>`).join(''):'Belum ada base.'}async function del(id){if(!confirm('Hapus base ini?'))return;let r=await supabaseClient.from('base_layouts').delete().eq('id',id);if(r.error)alert(r.error.message);load()}check();
</script></body></html>
